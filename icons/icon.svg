<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000000"/>
  <!-- Overlapping Geometric Cards with Typographic A -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back card, rotated -->
    <rect x="150" y="85" width="220" height="300" rx="20" stroke-width="14" stroke-opacity="0.45" fill="#000000" transform="rotate(10 260 235)"/>
    <!-- Foreground card -->
    <rect x="146" y="106" width="220" height="300" rx="20" stroke-width="16" fill="#000000"/>
    <!-- Stylized Typographic 'A' -->
    <path d="M 256 175 L 196 335 M 256 175 L 316 335 M 216 290 L 296 290" stroke-width="20"/>
  </g>
</svg>
